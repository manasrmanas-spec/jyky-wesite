<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JKYC Admin Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-header">

            <img src="../images/logo.png" alt="JKYC Logo">

            <h2>JKYC Admin Panel</h2>

            <p>Jana Kalyan Youth Club</p>

        </div>

        <form id="loginForm">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Admin Email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

            </div>

            <div class="login-options">

                <label>

                    <input type="checkbox" id="showPassword">

                    Show Password

                </label>

            </div>
            <button type="submit" id="loginBtn" class="btn login-btn">
                🔐 Login
            </button>

            <div class="login-links">

                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>

            </div>

        </form>

    </div>

</div>

<footer class="footer">

    <p>
        © 2026 Jana Kalyan Youth Club
        <br>
        Admin Panel Version 2.0
    </p>

</footer>

<script src="../js/main.js"></script>
<script type="module" src="../js/admin-login.js"></script>

</body>
</html>
